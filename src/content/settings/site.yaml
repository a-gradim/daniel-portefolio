bio:
  en: >-
    Audiovisual creative working across film, photography, visual
    experimentation and creative direction.


    My practice moves between commissioned work and personal experimentation,
    with a focus on image-making, atmosphere and building coherent visual
    identities across different formats.


    I work from concept and visual research through production, shooting and
    post-production — increasingly interested in developing complete creative
    worlds rather than isolated images.
  pt: >-
    Criativo audiovisual a trabalhar entre filme, fotografia, experimentação
    visual e direção criativa.


    A minha prática move-se entre trabalhos encomendados e experimentação
    pessoal, com foco na criação de imagens, na atmosfera e na construção de
    identidades visuais coerentes em diferentes formatos.


    Trabalho desde o conceito e a pesquisa visual até à produção, à rodagem e à
    pós-produção, interessado cada vez mais em desenvolver mundos criativos
    completos, em vez de imagens isoladas.
