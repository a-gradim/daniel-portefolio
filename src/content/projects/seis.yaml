body:
  en: >-
    Product photography developed for SEIS, with a visual approach built around
    presenting the pieces clearly while maintaining a strong and controlled
    image.


    Composition, lighting, background and framing were considered as part of the
    same visual system, allowing the product itself to remain the central
    element.


    I was responsible for the concept, photography and final retouching,
    producing a consistent set of images for the brand’s commercial
    communication.
  pt: >-
    Fotografia de produto desenvolvida para a SEIS, com uma abordagem visual
    construída em torno da apresentação clara das peças, mantendo uma imagem
    forte e controlada.


    A composição, a iluminação, o fundo e o enquadramento foram pensados como
    parte do mesmo sistema visual, permitindo que o próprio produto continue a
    ser o elemento central.


    Fui responsável pelo conceito, pela fotografia e pelo retoque final,
    produzindo um conjunto coerente de imagens para a comunicação comercial da
    marca.
