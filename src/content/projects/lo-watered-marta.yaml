body:
  en: >-
    A fashion-focused still and moving-image series created around the LOSIENTO
    × Watered Marta collaboration.


    Photography and short-form video are treated as one visual language, using
    portraiture, styling, movement and close attention to the garments to keep
    the campaign coherent across formats.


    The final selection brings the stills and videos together as a connected set
    of assets for digital communication, with a consistent treatment across
    capture and post-production.
  pt: >-
    Uma série de imagem fixa e de imagem em movimento, centrada na moda, criada
    em torno da colaboração LOSIENTO × Watered Marta.


    A fotografia e o vídeo de curta duração são tratados como uma só linguagem
    visual, recorrendo ao retrato, ao styling, ao movimento e a uma atenção
    cuidada às peças, para manter a campanha coerente entre formatos.


    A seleção final reúne fotografias e vídeos num conjunto coeso de materiais
    para comunicação digital, com um tratamento consistente desde a captação até
    à pós-produção.
