body:
  en: >-
    Portraits made across different settings, from close views of a face to
    wider frames that retain part of the surrounding space. The selection brings
    together direct gazes, profiles and moments where the subject turns away
    from the camera.


    Colour and monochrome are used across the series. Blue backgrounds, warm
    light and waterside settings give the photographs different visual
    treatments, while framing keeps the person central to each image.


    I photographed and edited the series, shaping the final selection through
    crop, colour and contrast.
  pt: >-
    Retratos feitos em diferentes cenários, desde planos aproximados do rosto a
    enquadramentos mais amplos que mantêm parte do espaço envolvente. A seleção
    reúne olhares diretos, perfis e momentos em que o sujeito se afasta da
    câmara.


    A cor e o preto e branco são usados ao longo da série. Fundos azuis, luz
    quente e cenários junto à água dão às fotografias tratamentos visuais
    diferentes, enquanto o enquadramento mantém a pessoa no centro de cada
    imagem.


    Fotografei e editei a série, dando forma à seleção final através do recorte,
    da cor e do contraste.
