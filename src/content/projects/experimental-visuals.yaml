body:
  en: >-
    # EXPERIMENTAL VISUALS

    **Generative Visuals · Creative Coding · Audiovisual Experimentation**


    ### Concept

    A collection of experimental audiovisual projects developed using
    TouchDesigner, exploring the relationship between image, sound, movement and
    generative processes.


    The work combines independent experiments, technical explorations and
    commissioned projects, using real-time visual processing to investigate new
    forms of audiovisual expression.


    ### Creative Exploration

    The projects explore different techniques and visual systems, focusing on
    the transformation and manipulation of digital imagery.


    Particular attention is given to displacement techniques, generative audio
    structures and video effects, exploring how different inputs and parameters
    can produce unexpected visual results.


    The process is driven by experimentation, learning and the development of
    custom visual approaches, allowing each project to evolve through technical
    exploration and creative intuition.


    ### Technical Approach

    - **Displacement:** Image distortion, displacement maps and spatial
    transformations.

    - **Generative Audio Structures:** Audio-reactive systems, procedural
    patterns and sound-driven visual behaviour.

    - **Video Effects:** Real-time image processing, visual distortion and
    manipulation.

    - **Real-time Visuals:** Development of interactive visual systems using
    TouchDesigner.

    - **Visual Experimentation:** Exploration of textures, movement, repetition
    and digital abstraction.


    ### Outcome

    An ongoing collection of visual experiments and commissioned works that
    explores the possibilities of real-time audiovisual creation.


    Rather than following a fixed visual language, each experiment serves as an
    opportunity to develop new techniques, discover unexpected aesthetics and
    expand the possibilities of digital image-making.


    **Areas of Work:** Generative Visuals · Creative Coding · Real-time
    Processing · Audio-reactive Visuals · Video Effects
  pt: >-
    # VISUAIS EXPERIMENTAIS

    **Visuais Generativos · Programação Criativa · Experimentação Audiovisual**


    ### Conceito

    Uma coleção de projectos audiovisuais experimentais desenvolvidos em
    TouchDesigner, que explora a relação entre imagem, som, movimento e
    processos generativos.


    O trabalho reúne experiências pessoais, explorações técnicas e projectos
    desenvolvidos para clientes, recorrendo ao processamento visual em tempo
    real para investigar novas formas de expressão audiovisual.


    ### Exploração Criativa

    Os projectos exploram diferentes técnicas e sistemas visuais, com especial
    atenção à transformação e manipulação de imagem digital.


    A investigação centra-se em técnicas de *displacement*, estruturas visuais
    generativas orientadas pelo som e efeitos de vídeo, explorando a forma como
    diferentes parâmetros e estímulos podem produzir resultados visuais
    inesperados.


    O processo assenta na experimentação, na aprendizagem e no desenvolvimento
    de abordagens visuais próprias, permitindo que cada projecto evolua através
    da exploração técnica e da intuição criativa.


    ### Abordagem Técnica

    - **Displacement:** Distorção de imagem, mapas de deslocamento e
    transformações espaciais.

    - **Estruturas Generativas de Áudio:** Sistemas reactivos ao som, padrões
    procedurais e comportamentos visuais orientados por estímulos sonoros.

    - **Efeitos de Vídeo:** Processamento de imagem em tempo real, distorção
    visual e manipulação de imagem.

    - **Visuais em Tempo Real:** Desenvolvimento de sistemas visuais
    interactivos através do TouchDesigner.

    - **Experimentação Visual:** Exploração de texturas, movimento, repetição e
    abstracção digital.


    ### Resultado

    Uma colecção em constante desenvolvimento de experiências visuais e
    projectos realizados para clientes, que explora as possibilidades da criação
