body:
  en: >+
    # MUSIC VIDEOS

    **Audiovisual Production · Cinematography · Creative Direction**


    ### Concept

    A collection of audiovisual projects developed in collaboration with
    musicians and artists, exploring the relationship between image, music and
    visual expression.


    Each music video draws from the artist's identity and sound, aiming to build
    a distinctive visual language that complements and expands the musical
    experience.


    ### Creative Direction

    The creative process focuses on translating music into visual form,
    exploring atmospheres, narratives and aesthetic elements that define the
    identity of each project.


    The approach varies according to each artist's creative universe, embracing
    visual experimentation, composition and the construction of distinctive
    environments.


    ### Production Process

    - Development of concepts and visual references.

    - Production planning and pre-production.

    - Cinematography and image capture.

    - Exploration of lighting, framing and camera movement.

    - Video editing and assembly.

    - Colour grading and finalisation.


    ### Outcome

    A collection of projects exploring different audiovisual languages,
    developed in collaboration with musicians and artists, where image becomes
    an extension of their musical identity.

  pt: >-
    # MUSIC VIDEOS

    **Produção Audiovisual · Cinematografia · Direção Criativa**


    ### Conceito

    Uma coleção de projetos audiovisuais desenvolvidos em colaboração com
    músicos e artistas, explorando a relação entre imagem, música e expressão
    visual.


    Cada videoclip parte da identidade e da sonoridade do artista, procurando
    construir uma linguagem visual própria que complemente e expanda a
    experiência musical.


    ### Direção Criativa

    O processo criativo centra-se na interpretação visual da música, explorando
    atmosferas, narrativas e elementos estéticos que definem a identidade de
    cada projeto.


    A abordagem varia consoante o universo de cada artista, privilegiando a
    experimentação visual, a composição e a construção de ambientes com
    personalidade.


    ### Processo de Produção

    - Desenvolvimento de conceitos e referências visuais.

    - Planeamento e preparação das filmagens.

    - Captação de imagem e cinematografia.

    - Exploração de iluminação, enquadramentos e movimento de câmara.

    - Montagem e edição de vídeo.

    - Tratamento de cor e finalização.


    ### Resultado

    Uma série de trabalhos que explora diferentes linguagens audiovisuais,
    desenvolvidos em colaboração com artistas e músicos, onde a imagem funciona
    como extensão da sua identidade musical.


    **Áreas de trabalho:** Direção Criativa · Cinematografia · Produção
    Audiovisual · Edição de Vídeo · Color Grading
