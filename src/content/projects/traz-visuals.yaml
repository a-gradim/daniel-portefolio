body:
  en: >-
    An experimental set of visual pieces developed for Traz os Monstros across
    still and moving image.


    The work uses distortion, repetition, collage-like image treatment and
    motion to expand the project’s identity beyond conventional promotional
    content.


    This section works as a visual testing ground, connecting graphic
    experimentation with short-form video and digital communication.
  pt: >-
    Um conjunto experimental de peças visuais desenvolvidas para os Traz os
    Monstros, em imagem fixa e em movimento.


    O trabalho recorre à distorção, à repetição, a um tratamento de imagem em
    forma de colagem e ao movimento para ampliar a identidade do projeto para
    além da comunicação promocional convencional.


    Esta secção funciona como um terreno de testes visuais, ligando a
    experimentação gráfica ao vídeo de curta duração e à comunicação digital.
