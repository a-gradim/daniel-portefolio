  en: "A series of short-form videos created around Traz os Monstros for digital communication.\n\nThe work is driven by rhythm, performance and fast visual ideas, with editing used to keep each piece distinct while still belonging to the same broader visual world."
  pt: "Uma série de vídeos de curta duração criados em torno dos Traz os Monstros para comunicação digital.\n\nO trabalho é guiado pelo ritmo, pela performance e por ideias visuais rápidas, com a montagem a manter cada peça distinta, sem deixar de pertencer ao mesmo universo visual."
