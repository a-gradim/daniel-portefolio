credits: Experimental Photography · Image Manipulation · Composition · Post-production
body:
  en: >-
    Photographic images reworked through tonal inversion and changes in colour
    and contrast. Faces, clothing and urban backgrounds become elements that can
    be obscured, isolated or brought into conflict.


    Some images keep a recognisable portrait; others shift attention towards
    silhouette, texture and colour. The editing changes how the photographed
    scene is read while retaining traces of the original setting.


    I created the photographs and developed the experimental treatment, taking
    each image from capture through its final edit.
  pt: >-
    Imagens fotográficas retrabalhadas através da inversão tonal e de alterações
    de cor e contraste. Rostos, roupas e fundos urbanos tornam-se elementos que
    podem ser ocultados, isolados ou colocados em confronto.


    Algumas imagens mantêm um retrato reconhecível; outras deslocam a atenção
    para a silhueta, a textura e a cor. A edição altera a forma como a cena
    fotografada é lida, mantendo, no entanto, vestígios do cenário original.


    Criei as fotografias e desenvolvi o tratamento experimental, acompanhando
    cada imagem desde a captação até à edição final.
