body:
  en: >+
    ### Overview

    A product photography study exploring the visual identity of a candle
    through composition, lighting and material interaction.


    The project focuses on transforming an everyday object into a visual
    subject, creating an atmosphere that highlights its form, texture and
    character.


    ### Creative Direction

    The visual approach was built around simplicity, atmosphere and the
    relationship between light and the product.


    Through carefully selected compositions and lighting, the objective was to
    create images that feel distinctive while maintaining the product as the
    central element.


    ### Photography & Lighting

    - Product-focused compositions and framing.

    - Controlled continuous lighting.

    - Exploration of shadows, contrast and reflections.

    - Attention to textures, materials and small details.

    - Experimental arrangements to create visual depth.


    ### Outcome

    A series of product photographs exploring the intersection between
    commercial photography and artistic expression, presenting the candle
    through a distinct visual perspective.

  pt: >
    ### Visão Geral

    Um estudo de fotografia de produto que explora a identidade visual de uma
    vela através da composição, iluminação e interação entre materiais.


    O projeto centra-se na transformação de um objeto quotidiano num elemento
    visual, criando uma atmosfera que realça a sua forma, textura e
    personalidade.


    ### Direção Criativa

    A abordagem visual foi construída em torno da simplicidade, da atmosfera e
    da relação entre a luz e o produto.


    Através de composições e iluminação cuidadosamente pensadas, o objetivo foi
    criar imagens distintas, mantendo o produto como elemento central.


    ### Fotografia e Iluminação

    - Composições e enquadramentos focados no produto.

    - Utilização controlada de iluminação contínua.

    - Exploração de sombras, contraste e reflexos.

    - Atenção às texturas, materiais e pequenos detalhes.

    - Experimentação com diferentes disposições para criar profundidade visual.


    ### Resultado

    Uma série de fotografias de produto que explora a interseção entre a
    fotografia publicitária e a expressão artística, apresentando a vela através
    de uma perspetiva visual própria.
