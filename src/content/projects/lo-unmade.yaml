credits: Concept · Filming · Editing
body:
  en: >-
    A series of fashion films created for LOSIENTO around the Unmade Collection.


    The visual approach was developed in dialogue with the identity of the
    collection, using movement, framing, texture and editing to translate the
    clothing into moving images rather than treating the videos simply as
    product documentation.


    I worked across the concept, filming and post-production, adapting the
    rhythm, effects and transitions of each piece while maintaining a coherent
    visual language across the campaign.
  pt: >-
    Uma série de filmes de moda criados para a LOSIENTO em torno da Unmade
    Collection.


    A abordagem visual foi desenvolvida em diálogo com a identidade da coleção,
    usando movimento, enquadramento, textura e montagem para traduzir a roupa em
    imagem em movimento, em vez de tratar os vídeos apenas como documentação de
    produto.


    Trabalhei na conceção, na filmagem e na pós-produção, adaptando o ritmo, os
    efeitos e as transições de cada peça e mantendo uma linguagem visual
    coerente ao longo da campanha.
