body:
  en: >-
    A collection of album-related visual material developed around the broader
    identity of Traz os Monstros.


    Photography, graphic treatment and object-based imagery are brought together
    to create a rough, tactile visual language that can extend beyond a single
    cover or format.


    The pieces are treated as parts of the same visual world, keeping the album
    artwork and supporting images connected rather than isolated.
  pt: >-
    Um conjunto de material visual associado ao álbum, desenvolvido em torno da
    identidade mais ampla dos Traz os Monstros.


    Fotografia, tratamento gráfico e imagens de objetos reúnem-se para criar uma
    linguagem visual crua e tátil, que pode ir além de uma única capa ou
    formato.


    As peças são tratadas como partes de um mesmo universo visual, mantendo a
    capa do álbum e as imagens de apoio ligadas entre si, em vez de isoladas.
