body:
  en: >-
    For the launch of a new Traz os Monstros merchandise drop, I developed a
    visual approach designed to present the pieces without disconnecting them
    from the identity of the project.


    The images balance product clarity with an editorial language, treating
    composition, light, framing and atmosphere as part of the same visual
    system.


    The session was built to work across different contexts — from more
    descriptive catalogue images to photographs with a stronger visual presence
    for social media and the communication of the drop.


    I was responsible for the visual concept, photography and final image
    treatment, keeping consistency across the different pieces.
  pt: >-
    Para o lançamento de uma nova linha de merchandising dos Traz os Monstros,
    desenvolvi uma abordagem visual pensada para apresentar as peças sem as
    desligar da identidade do projeto.


    As imagens equilibram a clareza do produto com uma linguagem editorial,
    tratando a composição, a luz, o enquadramento e a atmosfera como parte do
    mesmo sistema visual.


    A sessão foi construída para funcionar em diferentes contextos, desde
    imagens mais descritivas para catálogo até fotografias com maior presença
    visual para as redes sociais e para a comunicação do lançamento.


    Fui responsável pelo conceito visual, pela fotografia e pelo tratamento
    final das imagens, garantindo consistência entre as diferentes peças.
