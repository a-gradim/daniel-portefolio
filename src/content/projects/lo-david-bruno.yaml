body:
  en: "Behind-the-scenes content created around the collaboration between LOSIENTO and David Bruno.\n\nThe approach was intentionally informal and observational, staying close to the people, spaces and moments surrounding the production rather than making the process feel overly staged.\n\nPhotography and VHS-style video were used together to create a more immediate and imperfect record of the collaboration, followed by editing and post-production for digital communication."
  pt: "Conteúdo de bastidores criado em torno da colaboração entre a LOSIENTO e o David Bruno.\n\nA abordagem foi intencionalmente informal e observacional, próxima das pessoas, dos espaços e dos momentos que rodeiam a produção, em vez de tornar o processo demasiado encenado.\n\nA fotografia e o vídeo em estilo VHS foram usados em conjunto para criar um registo mais imediato e imperfeito da colaboração, seguido de montagem e pós-produção para comunicação digital."
