body:
  en: >-
    Photographs of vegetation, water and small details, with attention to how
    light separates a subject from its surroundings. Bright stems against dark
    backgrounds, dense foliage and the surface of the sea set the visual range
    of the series.


    The framing moves between recognisable scenes and tighter views where
    texture and colour carry the image. Green, blue and violet tones connect the
    photographs while leaving room for the differences between each setting.


    I photographed and edited the series, choosing the framing, colour and
    contrast for each image.
  pt: >-
    Fotografias de vegetação, água e pequenos detalhes, com atenção à forma como
    a luz separa um sujeito do que o rodeia. Caules luminosos contra fundos
    escuros, folhagem densa e a superfície do mar definem a gama visual da
    série.


    O enquadramento alterna entre cenas reconhecíveis e planos mais fechados,
    onde a textura e a cor sustentam a imagem. Os tons verdes, azuis e violeta
    ligam as fotografias, deixando espaço para as diferenças entre cada cenário.


    Fotografei e editei a série, escolhendo o enquadramento, a cor e o contraste
    de cada imagem.
