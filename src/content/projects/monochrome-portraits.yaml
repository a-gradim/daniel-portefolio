body:
  en: >-
    A portrait series built around a single subject and a consistent monochrome
    treatment. Side light catches the face, hands and hair while the background
    stays dark.


    Changes in crop, gaze and gesture give each photograph a different emphasis.
    The sequence moves between wider portraits and close views, keeping strong
    shadow areas as part of the composition.


    I developed the series and handled photography and image editing, working on
    contrast and tonal separation across the final selection.
  pt: >-
    Uma série de retratos construída em torno de um único sujeito e de um
    tratamento a preto e branco consistente. A luz lateral capta o rosto, as
    mãos e o cabelo, enquanto o fundo se mantém escuro.


    As variações de recorte, de olhar e de gesto dão a cada fotografia uma
    ênfase diferente. A sequência alterna entre retratos mais amplos e planos
    aproximados, mantendo as zonas de sombra marcadas como parte da composição.


    Desenvolvi a série e assegurei a fotografia e a edição de imagem,
    trabalhando o contraste e a separação tonal na seleção final.
