body:
  en: "Backstage documentation created during Portugal Fashion Experience 2025, photographed inside a fast-moving environment with constantly changing light, people and situations.\n\nRather than approaching the event as straightforward documentation, I focused on the atmosphere surrounding the show — transitions between spaces, details, preparation and spontaneous moments.\n\nThe visual language was developed around the energy and unpredictability of backstage, followed by selection, colour treatment and final post-production after the event."
  pt: "Documentação de bastidores criada durante o Portugal Fashion Experience 2025, fotografada num ambiente em constante movimento, com luz, pessoas e situações sempre a mudar.\n\nEm vez de abordar o evento como documentação direta, concentrei-me na atmosfera que rodeia o desfile: as transições entre espaços, os detalhes, a preparação e os momentos espontâneos.\n\nA linguagem visual foi desenvolvida em torno da energia e da imprevisibilidade dos bastidores, seguida de seleção, tratamento de cor e pós-produção final depois do evento."
