body:
  en: >-
    A collaborative visual project developed with NotFound.


    The concept was built jointly, combining both perspectives into a shared
    visual language rather than following a predefined commercial brief.


    I worked on the development of the visual approach, captured the material
    and handled the final editing, shaping the collaboration into a coherent
    final series.
  pt: >-
    Um projeto visual colaborativo desenvolvido com a NotFound.


    O conceito foi construído em conjunto, combinando as duas perspetivas numa
    linguagem visual partilhada, em vez de seguir um briefing comercial
    pré-definido.


    Trabalhei no desenvolvimento da abordagem visual, captei o material e fiz a
    edição final, dando forma à colaboração numa série coerente.
