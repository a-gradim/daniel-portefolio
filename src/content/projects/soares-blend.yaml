body:
  en: >-
    A series of promotional videos developed for SoaresBlend, created to
    translate the brand into short-form visual content.


    Each piece was built around its own concept and narrative structure, with
    attention to framing, movement, pacing and colour treatment throughout the
    production and post-production process.


    I was responsible for the concept, filming and editing, shaping each video
    around the needs of the brand while keeping a consistent visual language
    across the series.
  pt: >-
    Uma série de vídeos promocionais desenvolvidos para a SoaresBlend, criados
    para traduzir a marca em conteúdo visual de curta duração.


    Cada peça foi construída em torno do seu próprio conceito e estrutura
    narrativa, com atenção ao enquadramento, ao movimento, ao ritmo e ao
    tratamento de cor ao longo de todo o processo de produção e pós-produção.


    Fiquei responsável pelo conceito, pela filmagem e pela montagem, moldando
    cada vídeo em função das necessidades da marca e mantendo uma linguagem
    visual consistente em toda a série.
