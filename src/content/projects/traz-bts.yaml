body:
  en: "A more observational record of the process around Traz os Monstros, focused on the moments that sit between finished releases and staged imagery.\n\nThe photography and video keep a direct, informal quality, using the working process itself as part of the visual identity rather than hiding it behind the final result."
  pt: "Um registo mais observacional do processo em torno dos Traz os Monstros, centrado nos momentos que existem entre os lançamentos finalizados e as imagens encenadas.\n\nA fotografia e o vídeo mantêm uma qualidade direta e informal, usando o próprio processo de trabalho como parte da identidade visual, em vez de o esconder por detrás do resultado final."
